name: CI/CD Pipeline - FastAPI MLOps API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: 🧪 Tests Automatisés (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source (Checkout)
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter la suite de tests (pytest)
        run: |
          pytest tests/test_api.py -v

  build-and-push:
    name: 🐳 Build & Push Docker Hub (CD)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Récupérer le code source (Checkout)
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ndataly/mlops_api:latest
            ndataly/mlops_api:v1.0
            ndataly/mlops_api:${{ github.sha }}
